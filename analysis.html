<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>التحليلات | Al Fayed Stocks</title>

<meta name="description"
      content="التحليلات الفنية للأسهم والأسواق السعودية والأمريكية - Al Fayed Stocks">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

</head>


<body>


<!-- ================= HEADER ================= -->

<div id="site-header"></div>


<main class="inner">

<div class="wrap">


<!-- ================= HERO ================= -->

<section class="pagehero">

<div class="eyebrow">
AL FAYED STOCKS
</div>

<h1>
التحليلات الفنية 📊
</h1>

<p>
تحليلات ومتابعة لأهم الأسهم والفرص في السوق السعودي والأمريكي.
</p>

</section>


<!-- ================= FILTER ================= -->

<div class="filter">

<button
class="filterbtn active"
onclick="filterCards('all',this)">
الكل
</button>

<button
class="filterbtn"
onclick="filterCards('saudi',this)">
🇸🇦 السعودي
</button>

<button
class="filterbtn"
onclick="filterCards('usa',this)">
🇺🇸 الأمريكي
</button>

</div>


<!-- ================= STATUS ================= -->

<div id="analysisStatus"
     class="muted"
     style="text-align:center;margin:20px 0;">

جاري تحميل التحليلات...

</div>


<!-- ================= ANALYSIS CARDS ================= -->

<div id="analysisCards"
     class="analysisgrid">

</div>


</div>

</main>


<!-- ================= FOOTER ================= -->

<div id="site-footer"></div>


<script src="app.js"></script>


<script>

/* =====================================================
   إعدادات الصفحة
===================================================== */

let sb = null;

let allRecommendations = [];


/* =====================================================
   أسماء الحالات
===================================================== */

const statusLabel = {

    open: "مفتوحة",

    watch: "مراقبة",

    closed: "مغلقة"

};


/* =====================================================
   حماية النصوص
===================================================== */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>'"]/g, function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            }[c];

        });

}


/* =====================================================
   تحديد السوق
===================================================== */

function marketClass(market){

    return market === "saudi"
        ? "saudi"
        : "usa";

}


/* =====================================================
   اسم السوق
===================================================== */

function marketName(market){

    return market === "saudi"
        ? "🇸🇦 سعودي"
        : "🇺🇸 أمريكي";

}


/* =====================================================
   رابط السوق
===================================================== */

function marketLink(market){

    return market === "saudi"
        ? "saudi.html"
        : "usa.html";

}


/* =====================================================
   إنشاء بطاقة التحليل
===================================================== */

function createCard(x){

    const market = marketClass(x.market);

    const marketTitle = marketName(x.market);

    const status =
        statusLabel[x.status] ||
        x.status ||
        "مراقبة";


    let note = x.note || "السهم تحت المتابعة.";

    /*
      لو الملاحظة تحتوي على نوع التوصية
      نعرضها كما هي.
    */


    return `

    <article
        class="analysiscard ${market}"
        data-market="${market}">

        <span>
            ${marketTitle}
            ${x.symbol ? " • " + esc(x.symbol) : ""}
        </span>


        <h2>
            ${esc(x.name)}
        </h2>


        <p>
            ${esc(note)}
        </p>


        <div class="levels">


            <b>
                الدخول
            </b>

            <strong>
                ${x.entry ?? "—"}
            </strong>


            <b>
                الهدف
            </b>

            <strong>
                ${x.target ?? "—"}
            </strong>


            <b>
                وقف الخسارة
            </b>

            <strong>
                ${x.stop_loss ?? "—"}
            </strong>


            <b>
                الحالة
            </b>

            <strong>
                ${esc(status)}
            </strong>


        </div>


        <a
            class="textlink"
            href="${marketLink(x.market)}">

            ${x.market === "saudi"
                ? "السوق السعودي ←"
                : "السوق الأمريكي ←"}

        </a>

    </article>

    `;

}


/* =====================================================
   عرض البطاقات
===================================================== */

function renderCards(data){

    const container =
        document.getElementById("analysisCards");

    const status =
        document.getElementById("analysisStatus");


    if(!data || !data.length){

        container.innerHTML = `

        <div class="card"
             style="grid-column:1/-1;text-align:center">

            <h3>
                لا توجد تحليلات منشورة حاليًا
            </h3>

            <p class="muted">
                سيتم عرض الأسهم هنا تلقائيًا
                عند إضافتها من لوحة الإدارة.
            </p>

        </div>

        `;

        status.textContent =
            "لا توجد توصيات منشورة حاليًا.";

        return;
    }


    container.innerHTML =
        data.map(createCard).join("");


    status.textContent =
        `آخر التحديثات • ${data.length} سهم تحت المتابعة`;

}


/* =====================================================
   تحميل التوصيات من Supabase
===================================================== */

async function loadAnalysis(){

    const container =
        document.getElementById("analysisCards");

    const status =
        document.getElementById("analysisStatus");


    /* التأكد من إعداد Supabase */

    if(
        !window.SUPABASE_URL ||
        !window.SUPABASE_ANON_KEY ||
        window.SUPABASE_ANON_KEY.includes("PASTE_")
    ){

        status.textContent =
            "لم يتم إعداد اتصال قاعدة البيانات.";

        container.innerHTML = `

        <div class="card"
             style="grid-column:1/-1;text-align:center">

            <h3>
                ⚙️ إعداد قاعدة البيانات
            </h3>

            <p class="muted">
                تأكد من وضع Publishable / Anon Key
                داخل ملف supabase-config.js
            </p>

        </div>

        `;

        return;
    }


    /* إنشاء الاتصال */

    sb = window.supabase.createClient(

        window.SUPABASE_URL,

        window.SUPABASE_ANON_KEY

    );


    try{


        const result =
            await sb
            .from("recommendations")
            .select("*")
            .order("created_at", {
                ascending:false
            });


        if(result.error){

            console.error(result.error);


            status.textContent =
                "تعذر تحميل التحليلات حاليًا.";

            container.innerHTML = `

            <div class="card"
                 style="grid-column:1/-1;text-align:center">

                <h3>
                    تعذر تحميل البيانات
                </h3>

                <p class="muted">
                    حاول تحديث الصفحة مرة أخرى.
                </p>

            </div>

            `;

            return;

        }


        allRecommendations =
            result.data || [];


        renderCards(allRecommendations);


    }catch(error){

        console.error(error);

        status.textContent =
            "حدث خطأ أثناء تحميل البيانات.";

    }

}


/* =====================================================
   الفلترة
===================================================== */

function filterCards(type, button){

    /* تحديث الزر النشط */

    document
        .querySelectorAll(".filterbtn")
        .forEach(function(btn){

            btn.classList.remove("active");

        });


    if(button){

        button.classList.add("active");

    }


    let filtered;


    if(type === "all"){

        filtered =
            allRecommendations;

    }else{

        filtered =
            allRecommendations.filter(function(item){

                return item.market === type;

            });

    }


    renderCards(filtered);

}


/* =====================================================
   تشغيل الصفحة
===================================================== */

loadAnalysis();

</script>


</body>

</html>
