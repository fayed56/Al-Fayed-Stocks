here<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>تفاصيل السهم | Al Fayed Stocks</title>

<meta
name="description"
content="تفاصيل وتحليل الأسهم السعودية - Al Fayed Stocks."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   STOCK PAGE
========================================================= */

.stock-page{
    min-height:75vh;
    padding:45px 0 80px;
}

.stock-container{
    width:min(1050px,100%);
    margin:auto;
}


/* =========================================================
   LOADING
========================================================= */

.stock-loading{
    min-height:400px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:#0b2028;

    border-radius:24px;

    color:#aebcc1;

    border:1px solid rgba(32,200,120,.12);
}

.stock-spinner{
    width:45px;
    height:45px;

    border:4px solid rgba(255,255,255,.08);
    border-top-color:#20c878;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin-bottom:18px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

.stock-error{
    background:#0b2028;

    border-radius:24px;

    padding:50px 25px;

    text-align:center;

    color:#fff;

    border:1px solid rgba(255,104,104,.15);
}

.stock-error-icon{
    font-size:50px;
    margin-bottom:10px;
}

.stock-error h2{
    margin:0 0 8px;

    font-size:23px;
    font-weight:900;
}

.stock-error p{
    margin:0;

    color:#9eafb5;

    font-size:14px;

    line-height:2;
}

.stock-back{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:22px;

    height:47px;

    padding:0 22px;

    border-radius:11px;

    background:#d8a94c;

    color:#06131a;

    text-decoration:none;

    font-size:13px;

    font-weight:900;
}


/* =========================================================
   MAIN CARD
========================================================= */

.stock-card{
    position:relative;

    overflow:hidden;

    background:#0b2028;

    border:1px solid rgba(32,200,120,.14);

    border-radius:25px;

    padding:27px;

    box-shadow:
        0 18px 50px rgba(6,19,26,.12);
}

.stock-card::before{
    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:4px;

    background:#20c878;
}


/* =========================================================
   HEADER
========================================================= */

.stock-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;

    padding-bottom:24px;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.stock-market{
    color:#20c878;

    font-size:12px;

    font-weight:900;

    margin-bottom:5px;
}

.stock-symbol{
    color:#fff;

    font-size:36px;

    font-weight:900;

    line-height:1.3;
}

.stock-name{
    color:#b7c4c8;

    font-size:17px;

    margin-top:3px;
}

.stock-sector{
    display:inline-flex;

    margin-top:10px;

    padding:5px 12px;

    border-radius:30px;

    background:rgba(216,169,76,.10);

    color:#d8a94c;

    font-size:11px;

    font-weight:900;
}


/* =========================================================
   PRICE
========================================================= */

.stock-price-area{
    min-width:210px;

    text-align:left;
}

.stock-price-label{
    color:#82939a;

    font-size:11px;

    margin-bottom:3px;
}

.stock-price{
    color:#fff;

    font-size:37px;

    font-weight:900;

    line-height:1.3;
}

.stock-change{
    display:inline-flex;

    align-items:center;

    gap:5px;

    margin-top:7px;

    padding:6px 13px;

    border-radius:30px;

    background:rgba(32,200,120,.10);

    color:#20c878;

    font-size:12px;

    font-weight:900;
}

.stock-change.down{
    background:rgba(255,104,104,.10);

    color:#ff6868;
}

.stock-change.flat{
    background:rgba(216,169,76,.10);

    color:#d8a94c;
}


/* =========================================================
   SECTION
========================================================= */

.stock-section{
    margin-top:25px;
}

.stock-section-title{
    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:12px;

    padding-right:10px;

    border-right:3px solid #20c878;

    color:#fff;

    font-size:17px;

    font-weight:900;
}


/* =========================================================
   DATA
========================================================= */

.stock-data{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.data-box{
    min-height:75px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:13px;

    padding:10px;
}

.data-label{
    color:#81939a;

    font-size:10px;

    margin-bottom:5px;

    text-align:center;
}

.data-value{
    color:#fff;

    font-size:14px;

    font-weight:900;

    direction:ltr;
}


/* =========================================================
   LEVELS
========================================================= */

.levels{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;
}

.level-card{
    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:15px;

    padding:17px;
}

.level-title{
    font-size:13px;

    font-weight:900;

    margin-bottom:12px;
}

.support{
    color:#20c878;
}

.resistance{
    color:#d8a94c;
}

.level-values{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}

.level-value{
    background:#0b2028;

    border:1px solid rgba(255,255,255,.06);

    border-radius:10px;

    padding:10px;

    text-align:center;

    color:#fff;

    font-size:15px;

    font-weight:900;

    direction:ltr;
}


/* =========================================================
   TARGET
========================================================= */

.targets{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:13px;
}

.target-box{
    background:#06131a;

    border-radius:15px;

    padding:19px;

    text-align:center;
}

.target-box.green{
    border-top:3px solid #20c878;
}

.target-box.red{
    border-top:3px solid #ff6868;
}

.target-label{
    color:#82939a;

    font-size:11px;

    margin-bottom:5px;
}

.target-value{
    font-size:25px;

    font-weight:900;

    direction:ltr;
}

.target-box.green .target-value{
    color:#20c878;
}

.target-box.red .target-value{
    color:#ff6868;
}


/* =========================================================
   ANALYSIS
========================================================= */

.analysis{
    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:15px;

    padding:20px;

    color:#c4d0d4;

    font-size:14px;

    line-height:2.2;

    white-space:pre-line;
}


/* =========================================================
   UPDATE
========================================================= */

.updated{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-top:23px;

    padding-top:16px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#74868d;

    font-size:11px;
}

.updated strong{
    color:#b2c0c5;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:15px;
}

.action{
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    text-decoration:none;

    font-family:'Cairo',sans-serif;

    font-size:13px;

    font-weight:900;

    transition:.2s;
}

.action:hover{
    transform:translateY(-2px);
}

.action-search{
    background:#20c878;

    color:#06131a;
}

.action-home{
    background:#06131a;

    color:#c3ced2;

    border:1px solid rgba(255,255,255,.10);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .stock-page{
        padding:30px 15px 60px;
    }

    .stock-card{
        padding:19px;

        border-radius:20px;
    }

    .stock-header{
        flex-direction:column;

        align-items:flex-start;

        gap:18px;
    }

    .stock-symbol{
        font-size:30px;
    }

    .stock-name{
        font-size:15px;
    }

    .stock-price-area{
        width:100%;

        text-align:right;
    }

    .stock-price{
        font-size:30px;
    }

    .stock-data{
        grid-template-columns:
            repeat(2,1fr);
    }

    .levels{
        grid-template-columns:1fr;
    }

}


@media(max-width:480px){

    .targets{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .updated{
        align-items:flex-start;

        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<div id="site-header"></div>


<main>

<section class="stock-page">

<div class="stock-container">

<div id="stockContent">

    <div class="stock-loading">

        <div class="stock-spinner"></div>

        <div>
            جاري تحميل بيانات السهم...
        </div>

    </div>

</div>

</div>

</section>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<div id="site-footer"></div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;


try{

    if(
        window.supabase &&
        window.SUPABASE_URL &&
        window.SUPABASE_ANON_KEY
    ){

        supabaseClient =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            );

    }

}catch(error){

    console.error(error);

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? '')
        .replace(
            /[&<>'"]/g,
            function(char){

                return {
                    '&':'&amp;',
                    '<':'&lt;',
                    '>':'&gt;',
                    "'":'&#39;',
                    '"':'&quot;'
                }[char];

            }
        );

}


/* =========================================================
   NUMBER
========================================================= */

function formatNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }

    const number = Number(value);

    if(!Number.isFinite(number)){

        return escapeHTML(
            String(value)
        );

    }

    return number.toLocaleString(
        'en-US',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   SIGNED NUMBER
========================================================= */

function formatSignedNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }

    const number = Number(value);

    if(!Number.isFinite(number)){

        return '—';

    }

    const formatted =
        number.toLocaleString(
            'en-US',
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

    return number > 0
        ? '+' + formatted
        : formatted;

}


/* =========================================================
   PERCENT
========================================================= */

function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }

    const number = Number(value);

    if(!Number.isFinite(number)){

        return '—';

    }

    return number > 0
        ? '+' + number.toFixed(2)
        : number.toFixed(2);

}


/* =========================================================
   VOLUME
========================================================= */

function formatVolume(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }

    const number = Number(value);

    if(!Number.isFinite(number)){

        return '—';

    }

    return number.toLocaleString('en-US');

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){

        return '—';

    }

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){

        return '—';

    }

    return date.toLocaleString(
        'ar-EG',
        {
            year:'numeric',
            month:'2-digit',
            day:'2-digit',
            hour:'2-digit',
            minute:'2-digit'
        }
    );

}


/* =========================================================
   GET SYMBOL
========================================================= */

function getSymbol(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get('symbol') ||
        ''
    ).trim();

}


/* =========================================================
   DATA BOX
========================================================= */

function dataBox(label,value){

    return `

        <div class="data-box">

            <div class="data-label">
                ${label}
            </div>

            <div class="data-value">
                ${escapeHTML(value)}
            </div>

        </div>

    `;

}


/* =========================================================
   LEVEL
========================================================= */

function level(value){

    return `

        <div class="level-value">

            ${
                value === null ||
                value === undefined ||
                value === ''
                ?
                '—'
                :
                formatNumber(value)
            }

        </div>

    `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(title,message){

    document.getElementById(
        'stockContent'
    ).innerHTML = `

        <div class="stock-error">

            <div class="stock-error-icon">
                ⚠️
            </div>

            <h2>
                ${title}
            </h2>

            <p>
                ${message}
            </p>

            <a
                href="watchlist.html"
                class="stock-back"
            >
                🔎 العودة إلى البحث
            </a>

        </div>

    `;

}


/* =========================================================
   LOAD STOCK
========================================================= */

async function loadStock(){

    const symbol = getSymbol();


    if(!symbol){

        showError(
            'لم يتم تحديد السهم',
            'افتح صفحة السهم من خلال صفحة البحث.'
        );

        return;

    }


    if(!supabaseClient){

        showError(
            'تعذر الاتصال',
            'تأكد من إعداد Supabase بشكل صحيح.'
        );

        return;

    }


    try{

        const result =
            await supabaseClient
                .from('saudi_stocks')
                .select('*')
                .eq('symbol',symbol)
                .maybeSingle();


        if(result.error){

            throw result.error;

        }


        if(!result.data){

            showError(
                'السهم غير موجود',
                `لم يتم العثور على السهم برمز ${escapeHTML(symbol)}.`
            );

            return;

        }


        document.title =
            `${result.data.name} | Al Fayed Stocks`;


        renderStock(result.data);


    }catch(error){

        console.error(
            'Stock loading error:',
            error
        );

        showError(
            'حدث خطأ',
            'تعذر تحميل بيانات السهم حاليًا.'
        );

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderStock(stock){

    const change =
        Number(stock.change_percent);


    let changeClass =
        'stock-change flat';

    let arrow = '•';


    if(change > 0){

        changeClass =
            'stock-change';

        arrow = '▲';

    }
    else if(change < 0){

        changeClass =
            'stock-change down';

        arrow = '▼';

    }


    document.getElementById(
        'stockContent'
    ).innerHTML = `

        <article class="stock-card">


            <!-- HEADER -->

            <div class="stock-header">

                <div>

                    <div class="stock-market">
                        🇸🇦 السوق السعودي
                    </div>

                    <div class="stock-symbol">
                        ${escapeHTML(stock.symbol)}
                    </div>

                    <div class="stock-name">
                        ${escapeHTML(stock.name)}
                    </div>

                    ${
                        stock.sector
                        ?
                        `
                        <div class="stock-sector">
                            ${escapeHTML(stock.sector)}
                        </div>
                        `
                        :
                        ''
                    }

                </div>


                <div class="stock-price-area">

                    <div class="stock-price-label">
                        السعر الحالي
                    </div>

                    <div class="stock-price">
                        ${formatNumber(stock.price)}
                    </div>

                    <div class="${changeClass}">

                        ${arrow}

                        ${formatSignedNumber(
                            stock.change_value
                        )}

                        ${
                            formatPercent(
                                stock.change_percent
                            ) !== '—'
                            ?
                            ` (${formatPercent(
                                stock.change_percent
                            )}%)`
                            :
                            ''
                        }

                    </div>

                </div>

            </div>


            <!-- TRADING DATA -->

            <section class="stock-section">

                <div class="stock-section-title">
                    📊 بيانات التداول
                </div>

                <div class="stock-data">

                    ${dataBox(
                        'الافتتاح',
                        formatNumber(stock.open_price)
                    )}

                    ${dataBox(
                        'أعلى سعر',
                        formatNumber(stock.high_price)
                    )}

                    ${dataBox(
                        'أدنى سعر',
                        formatNumber(stock.low_price)
                    )}

                    ${dataBox(
                        'الإغلاق السابق',
                        formatNumber(stock.previous_close)
                    )}

                    ${dataBox(
                        'حجم التداول',
                        formatVolume(stock.volume)
                    )}

                    ${dataBox(
                        'التغير',
                        formatSignedNumber(stock.change_value)
                    )}

                    ${dataBox(
                        'نسبة التغير',
                        formatPercent(stock.change_percent) === '—'
                        ?
                        '—'
                        :
                        formatPercent(stock.change_percent)+'%'
                    )}

                    ${dataBox(
                        'رمز السهم',
                        stock.symbol
                    )}

                </div>

            </section>


            <!-- LEVELS -->

            <section class="stock-section">

                <div class="stock-section-title">
                    📈 المستويات الفنية
                </div>

                <div class="levels">


                    <div class="level-card">

                        <div class="level-title support">
                            🟢 مناطق الدعم
                        </div>

                        <div class="level-values">

                            ${level(
                                stock.support_1
                            )}

                            ${level(
                                stock.support_2
                            )}

                        </div>

                    </div>


                    <div class="level-card">

                        <div class="level-title resistance">
                            🟡 مناطق المقاومة
                        </div>

                        <div class="level-values">

                            ${level(
                                stock.resistance_1
                            )}

                            ${level(
                                stock.resistance_2
                            )}

                        </div>

                    </div>


                </div>

            </section>


            <!-- TARGET -->

            <section class="stock-section">

                <div class="stock-section-title">
                    🎯 الهدف ووقف الخسارة
                </div>

                <div class="targets">


                    <div class="target-box green">

                        <div class="target-label">
                            🎯 الهدف
                        </div>

                        <div class="target-value">
                            ${formatNumber(stock.target)}
                        </div>

                    </div>


                    <div class="target-box red">

                        <div class="target-label">
                            🛑 وقف الخسارة
                        </div>

                        <div class="target-value">
                            ${formatNumber(stock.stop_loss)}
                        </div>

                    </div>


                </div>

            </section>


            <!-- ANALYSIS -->

            <section class="stock-section">

                <div class="stock-section-title">
                    📝 التحليل الفني
                </div>

                <div class="analysis">

                    ${
                        stock.analysis
                        ?
                        escapeHTML(stock.analysis)
                        :
                        'لا يوجد تحليل فني مضاف لهذا السهم حاليًا.'
                    }

                </div>

            </section>


            <!-- UPDATE -->

            <div class="updated">

                <div>

                    🕐 آخر تحديث:

                    <strong>
                        ${formatDate(stock.updated_at)}
                    </strong>

                </div>

                <div>

                    بيانات
                    <strong>
                        Al Fayed Stocks
                    </strong>

                </div>

            </div>


            <!-- ACTIONS -->

            <div class="actions">

                <a
                    href="watchlist.html"
                    class="action action-search"
                >
                    🔎 البحث عن سهم آخر
                </a>

                <a
                    href="index.html"
                    class="action action-home"
                >
                    🏠 العودة للرئيسية
                </a>

            </div>


        </article>

    `;

}


/* =========================================================
   START
========================================================= */

loadStock();

</script>

</body>
</html>
