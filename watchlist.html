<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>بحث الأسهم | Al Fayed Stocks</title>
<meta name="description" content="البحث عن الأسهم السعودية وتحليل بياناتها - Al Fayed Stocks.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
.watch-page{padding:45px 15px 80px;min-height:75vh}
.watch-container{width:min(1050px,100%);margin:auto}
.watch-hero{background:#0b2028;border:1px solid rgba(32,200,120,.14);border-radius:25px;padding:32px;text-align:center;margin-bottom:20px}
.watch-eyebrow{color:#20c878;font-size:11px;font-weight:900;letter-spacing:.5px}
.watch-title{color:#fff;font-size:32px;font-weight:900;margin:8px 0}
.watch-description{color:#aebcc1;font-size:14px;line-height:2;margin:0}
.search-box{display:flex;gap:10px;margin-top:24px}
#watchInput{flex:1;height:52px;background:#06131a;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;padding:0 17px;font-family:'Cairo',sans-serif;font-size:14px;outline:none}
#watchInput:focus{border-color:#20c878}
#searchButton{height:52px;padding:0 25px;border:0;border-radius:12px;background:#20c878;color:#06131a;font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;cursor:pointer}
.search-status{margin:15px 0;color:#82939a;font-size:12px;text-align:center}
.watch-list{display:grid;gap:15px}
.stock-result{background:#0b2028;border:1px solid rgba(32,200,120,.12);border-radius:22px;padding:22px}
.stock-top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:17px;border-bottom:1px solid rgba(255,255,255,.06)}
.stock-market{color:#20c878;font-size:10px;font-weight:900}
.stock-symbol{color:#fff;font-size:27px;font-weight:900}
.stock-name{color:#b8c5c9;font-size:14px}
.stock-sector{display:inline-block;margin-top:7px;padding:4px 10px;border-radius:20px;background:rgba(216,169,76,.1);color:#d8a94c;font-size:10px;font-weight:800}
.stock-price{text-align:left}
.price-label{color:#82939a;font-size:10px}
.price-value{color:#fff;font-size:28px;font-weight:900}
.change{font-size:11px;font-weight:900}
.up{color:#20c878}.down{color:#ff6868}.flat{color:#d8a94c}
.stock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.info{background:#06131a;border-radius:11px;padding:12px;text-align:center}
.info span{display:block;color:#778990;font-size:9px;margin-bottom:4px}
.info strong{color:#fff;font-size:12px;direction:ltr;display:block}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.level{background:#06131a;border-radius:12px;padding:13px}
.level h4{margin:0 0 9px;font-size:11px}
.level-values{display:flex;gap:8px}
.level-values span{flex:1;background:#0b2028;border-radius:8px;padding:8px;text-align:center;color:#fff;font-size:12px;font-weight:900;direction:ltr}
.support-title{color:#20c878}.resistance-title{color:#d8a94c}
.analysis{margin-top:15px;background:#06131a;border-radius:12px;padding:15px;color:#c1cdd1;font-size:12px;line-height:2;white-space:pre-line}
.details-button{display:flex;align-items:center;justify-content:center;width:100%;height:48px;margin-top:15px;border-radius:11px;background:#d8a94c;color:#06131a;text-decoration:none;font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;transition:.2s}
.details-button:hover{transform:translateY(-2px);filter:brightness(1.05)}
.empty{background:#0b2028;border:1px dashed rgba(255,255,255,.1);border-radius:20px;padding:45px 20px;text-align:center;color:#82939a;font-size:13px}
.error{color:#ff6868}
.back-search{display:inline-flex;margin-top:15px;height:44px;padding:0 20px;align-items:center;justify-content:center;background:#20c878;color:#06131a;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px}
@media(max-width:700px){
 .watch-hero{padding:24px 17px}.watch-title{font-size:26px}
 .search-box{flex-direction:column}#searchButton{width:100%}
 .stock-top{flex-direction:column;align-items:flex-start}.stock-price{text-align:right;width:100%}
 .stock-grid{grid-template-columns:repeat(2,1fr)}
 .levels{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="site-header"></div>

<main>
<section class="watch-page">
<div class="watch-container">

<div class="watch-hero">
<div class="watch-eyebrow">STOCK SEARCH • AL FAYED STOCKS</div>
<h1 class="watch-title">🔎 البحث عن الأسهم</h1>
<p class="watch-description">ابحث عن أي سهم سعودي بالاسم أو رمز التداول لعرض بياناته وتحليله.</p>

<div class="search-box">
<input id="watchInput" type="search" placeholder="اكتب اسم السهم أو رمز التداول..." autocomplete="off">
<button id="searchButton" type="button" onclick="searchStock()">🔎 بحث</button>
</div>
</div>

<div id="searchStatus" class="search-status">اكتب اسم السهم أو الرمز ثم اضغط بحث.</div>
<div id="watchList" class="watch-list"></div>

</div>
</section>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>

<script>
let supabaseClient=null;

try{
 if(window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY){
  supabaseClient=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
 }
}catch(error){console.error(error)}

function normalizeArabic(value){
 return String(value||'')
  .toLowerCase()
  .replace(/[أإآ]/g,'ا')
  .replace(/ى/g,'ي')
  .replace(/ة/g,'ه')
  .replace(/ؤ/g,'و')
  .replace(/ئ/g,'ي')
  .replace(/[\u064B-\u065F\u0670]/g,'')
  .replace(/\s+/g,' ')
  .trim();
}

function escapeHTML(value){
 return String(value??'').replace(/[&<>'"]/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
 }[c]));
}

function number(value){
 if(value===null||value===undefined||value==='') return '—';
 const n=Number(value);
 return Number.isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
}

function volume(value){
 if(value===null||value===undefined||value==='') return '—';
 const n=Number(value);
 return Number.isFinite(n)?n.toLocaleString('en-US'):'—';
}

function signed(value){
 if(value===null||value===undefined||value==='') return '—';
 const n=Number(value);
 if(!Number.isFinite(n)) return '—';
 return (n>0?'+':'')+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function pct(value){
 if(value===null||value===undefined||value==='') return '—';
 const n=Number(value);
 return Number.isFinite(n)?(n>0?'+':'')+n.toFixed(2)+'%':'—';
}

function dateTime(value){
 if(!value) return '—';
 const d=new Date(value);
 if(Number.isNaN(d.getTime())) return '—';
 return d.toLocaleString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function info(label,value){
 return `<div class="info"><span>${label}</span><strong>${escapeHTML(value)}</strong></div>`;
}

function level(value){
 return `<span>${value===null||value===undefined||value===''?'—':number(value)}</span>`;
}

async function searchStock(){

 const input=document.getElementById('watchInput');
 const query=input.value.trim();
 const status=document.getElementById('searchStatus');
 const list=document.getElementById('watchList');

 if(!query){
  status.textContent='اكتب اسم السهم أو رمز التداول أولًا.';
  list.innerHTML='';
  return;
 }

 if(!supabaseClient){
  status.innerHTML='<span class="error">تعذر الاتصال بقاعدة البيانات.</span>';
  return;
 }

 status.textContent='جاري البحث...';
 list.innerHTML='';

 try{

  const {data,error}=await supabaseClient
   .from('saudi_stocks')
   .select('*')
   .order('name',{ascending:true});

  if(error) throw error;

  const q=normalizeArabic(query);

  const results=(data||[]).filter(stock=>{
   const symbol=String(stock.symbol||'').toLowerCase();
   const name=normalizeArabic(stock.name);
   const sector=normalizeArabic(stock.sector);
   return symbol.includes(q)||name.includes(q)||sector.includes(q);
  });

  if(!results.length){
   status.textContent='لم يتم العثور على سهم مطابق.';
   list.innerHTML=`
    <div class="empty">
     لا توجد نتائج للبحث عن: <strong>${escapeHTML(query)}</strong>
     <br>
     <a href="watchlist.html" class="back-search">🔎 بحث جديد</a>
    </div>`;
   return;
  }

  status.textContent=`تم العثور على ${results.length} نتيجة.`;
  list.innerHTML=results.map(renderStock).join('');

 }catch(error){
  console.error(error);
  status.innerHTML='<span class="error">حدث خطأ أثناء البحث. تأكد من اتصال Supabase.</span>';
 }
}

function renderStock(stock){

 const change=Number(stock.change_percent);
 let changeClass='flat',arrow='•';

 if(change>0){changeClass='up';arrow='▲'}
 if(change<0){changeClass='down';arrow='▼'}

 const symbol=encodeURIComponent(stock.symbol||'');

 return `
 <article class="stock-result">

  <div class="stock-top">

   <div>
    <div class="stock-market">🇸🇦 السوق السعودي</div>
    <div class="stock-symbol">${escapeHTML(stock.symbol)}</div>
    <div class="stock-name">${escapeHTML(stock.name)}</div>
    ${stock.sector?`<div class="stock-sector">${escapeHTML(stock.sector)}</div>`:''}
   </div>

   <div class="stock-price">
    <div class="price-label">السعر الحالي</div>
    <div class="price-value">${number(stock.price)}</div>
    <div class="change ${changeClass}">
     ${arrow} ${signed(stock.change_value)}
     ${pct(stock.change_percent)}
    </div>
   </div>

  </div>

  <div class="stock-grid">
   ${info('الافتتاح',number(stock.open_price))}
   ${info('أعلى سعر',number(stock.high_price))}
   ${info('أدنى سعر',number(stock.low_price))}
   ${info('الإغلاق السابق',number(stock.previous_close))}
   ${info('حجم التداول',volume(stock.volume))}
   ${info('الدعم الأول',number(stock.support_1))}
   ${info('المقاومة الأولى',number(stock.resistance_1))}
   ${info('آخر تحديث',dateTime(stock.updated_at))}
  </div>

  <div class="levels">

   <div class="level">
    <h4 class="support-title">🟢 مناطق الدعم</h4>
    <div class="level-values">
     ${level(stock.support_1)}
     ${level(stock.support_2)}
    </div>
   </div>

   <div class="level">
    <h4 class="resistance-title">🟡 مناطق المقاومة</h4>
    <div class="level-values">
     ${level(stock.resistance_1)}
     ${level(stock.resistance_2)}
    </div>
   </div>

  </div>

  ${stock.analysis?`
  <div class="analysis">
   <strong>📝 التحليل:</strong><br>
   ${escapeHTML(stock.analysis)}
  </div>`:''}

  <!-- زر تفاصيل السهم -->
  <a
   class="details-button"
   href="stock.html?symbol=${symbol}"
  >
   📊 عرض تفاصيل السهم
  </a>

 </article>`;
}

document.getElementById('watchInput').addEventListener('keydown',function(event){
 if(event.key==='Enter'){
  event.preventDefault();
  searchStock();
 }
});
</script>

</body>
</html>
