<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>بحث الأسهم | Al Fayed Stocks</title>

<meta
name="description"
content="ابحث عن الأسهم السعودية واعرف السعر الحالي والتغير والدعوم والمقاومات والتحليل الفني من Al Fayed Stocks."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">


<style>

/* =========================================================
   STOCK SEARCH PAGE
========================================================= */

.watch-page{
    min-height:75vh;
    padding:55px 0 90px;
}

.watch-page *{
    box-sizing:border-box;
}


/* =========================================================
   HERO
========================================================= */

.watch-hero{
    max-width:900px;
    margin:0 auto 32px;
    text-align:center;
}

.watch-eyebrow{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    color:#d8a94c;
    font-size:13px;
    font-weight:900;
    letter-spacing:.5px;

    margin-bottom:10px;
}

.watch-hero h1{
    margin:0;

    color:#142136;

    font-size:42px;
    line-height:1.35;
    font-weight:900;
}

.watch-hero p{
    max-width:700px;

    margin:12px auto 0;

    color:#4a5965;

    font-size:17px;
    line-height:2;
}


/* =========================================================
   SEARCH BOX
========================================================= */

.watch-search{
    width:min(900px,100%);

    margin:0 auto 16px;

    padding:25px;

    background:#0b2028;

    border:1px solid rgba(32,200,120,.18);

    border-radius:22px;

    box-shadow:
        0 18px 45px rgba(6,19,26,.10);
}

.watch-search-title{
    color:#fff;

    font-size:19px;
    font-weight:900;

    margin-bottom:14px;
}

.watch-search-form{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
}

.watch-search-input{
    width:100%;
    height:55px;

    border:1px solid rgba(255,255,255,.12);

    border-radius:12px;

    background:#06131a;

    color:#fff;

    padding:0 17px;

    font-family:'Cairo',sans-serif;

    font-size:15px;

    outline:none;

    transition:.2s;
}

.watch-search-input::placeholder{
    color:#75878e;
}

.watch-search-input:focus{
    border-color:#20c878;

    box-shadow:
        0 0 0 3px rgba(32,200,120,.08);
}

.watch-search-button{
    min-width:150px;
    height:55px;

    border:0;

    border-radius:12px;

    background:#d8a94c;

    color:#06131a;

    font-family:'Cairo',sans-serif;

    font-size:15px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.watch-search-button:hover{
    transform:translateY(-2px);
    filter:brightness(1.04);
}

.watch-search-button:disabled{
    opacity:.65;
    cursor:wait;
    transform:none;
}


/* =========================================================
   SEARCH HINT
========================================================= */

.watch-hint{
    width:min(900px,100%);

    margin:0 auto 25px;

    text-align:center;

    color:#61707a;

    font-size:13px;

    line-height:1.9;
}

.watch-hint strong{
    color:#159e64;
}


/* =========================================================
   STATUS
========================================================= */

.search-status{
    width:min(1000px,100%);

    min-height:24px;

    margin:0 auto 16px;

    text-align:center;

    font-size:13px;
    font-weight:800;
}

.search-status.loading{
    color:#c99b43;
}

.search-status.success{
    color:#169c61;
}

.search-status.error{
    color:#e45858;
}


/* =========================================================
   RESULTS
========================================================= */

.watch-results{
    width:min(1000px,100%);

    margin:0 auto;
}


/* =========================================================
   EMPTY
========================================================= */

.watch-empty,
.watch-not-found{
    background:#0b2028;

    border:1px solid rgba(255,255,255,.07);

    border-radius:22px;

    padding:45px 25px;

    text-align:center;

    color:#9eafb5;

    box-shadow:
        0 15px 35px rgba(6,19,26,.07);
}

.watch-empty-icon,
.watch-not-found-icon{
    font-size:43px;

    margin-bottom:10px;
}

.watch-empty-title,
.watch-not-found-title{
    color:#fff;

    font-size:19px;

    font-weight:900;

    margin-bottom:6px;
}

.watch-empty-text,
.watch-not-found-text{
    color:#9eafb5;

    font-size:13px;

    line-height:1.9;
}


/* =========================================================
   STOCK CARD
========================================================= */

.stock-card{
    position:relative;

    overflow:hidden;

    background:#0b2028;

    border:1px solid rgba(32,200,120,.13);

    border-radius:24px;

    padding:26px;

    color:#fff;

    box-shadow:
        0 18px 45px rgba(6,19,26,.11);
}

.stock-card::before{
    content:"";

    position:absolute;

    top:0;
    right:0;
    left:0;

    height:4px;

    background:#20c878;
}


/* =========================================================
   STOCK HEADER
========================================================= */

.stock-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:25px;

    padding-bottom:22px;

    border-bottom:1px solid rgba(255,255,255,.07);
}

.stock-market{
    color:#20c878;

    font-size:13px;

    font-weight:900;

    margin-bottom:4px;
}

.stock-symbol{
    color:#fff;

    font-size:31px;

    font-weight:900;

    line-height:1.3;
}

.stock-name{
    color:#b3c0c5;

    font-size:16px;

    margin-top:2px;
}

.stock-sector{
    display:inline-flex;

    margin-top:9px;

    padding:4px 11px;

    border-radius:30px;

    background:rgba(216,169,76,.10);

    color:#d8a94c;

    font-size:11px;

    font-weight:800;
}


/* =========================================================
   PRICE
========================================================= */

.stock-price-area{
    min-width:190px;

    text-align:left;
}

.stock-price-label{
    color:#82939a;

    font-size:11px;

    margin-bottom:2px;
}

.stock-price{
    color:#fff;

    font-size:32px;

    line-height:1.3;

    font-weight:900;
}

.stock-change{
    display:inline-flex;

    align-items:center;

    gap:5px;

    margin-top:6px;

    padding:5px 11px;

    border-radius:20px;

    background:rgba(32,200,120,.10);

    color:#20c878;

    font-size:12px;

    font-weight:900;
}

.stock-change.down{
    background:rgba(255,104,104,.10);

    color:#ff6868;
}

.stock-change.flat{
    background:rgba(216,169,76,.10);

    color:#d8a94c;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.stock-section-title{
    display:flex;

    align-items:center;

    gap:8px;

    margin:23px 0 12px;

    padding-right:10px;

    border-right:3px solid #20c878;

    color:#fff;

    font-size:16px;

    font-weight:900;
}


/* =========================================================
   DETAILS GRID
========================================================= */

.stock-details{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;
}

.stock-detail{
    min-height:68px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:12px;

    padding:9px;
}

.stock-detail-label{
    color:#82939a;

    font-size:10px;

    margin-bottom:4px;

    text-align:center;
}

.stock-detail-value{
    color:#fff;

    font-size:13px;

    font-weight:900;

    text-align:center;

    direction:ltr;
}


/* =========================================================
   LEVELS
========================================================= */

.stock-levels{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.stock-level-box{
    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:14px;

    padding:16px;
}

.stock-level-heading{
    margin-bottom:11px;

    font-size:13px;

    font-weight:900;
}

.stock-level-heading.support{
    color:#20c878;
}

.stock-level-heading.resistance{
    color:#d8a94c;
}

.stock-level-items{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.stock-level{
    min-width:80px;

    padding:7px 11px;

    border-radius:9px;

    background:#0b2028;

    border:1px solid rgba(255,255,255,.07);

    color:#fff;

    font-size:13px;

    font-weight:900;

    text-align:center;

    direction:ltr;
}


/* =========================================================
   PLAN
========================================================= */

.stock-plan{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;
}

.stock-plan-box{
    background:#06131a;

    border-radius:13px;

    padding:15px;

    text-align:center;
}

.stock-plan-label{
    display:block;

    color:#82939a;

    font-size:11px;

    margin-bottom:5px;
}

.stock-plan-value{
    font-size:19px;

    font-weight:900;

    direction:ltr;
}

.stock-plan-box.target{
    border-top:2px solid #20c878;
}

.stock-plan-box.target .stock-plan-value{
    color:#20c878;
}

.stock-plan-box.stop{
    border-top:2px solid #ff6868;
}

.stock-plan-box.stop .stock-plan-value{
    color:#ff6868;
}


/* =========================================================
   ANALYSIS
========================================================= */

.stock-analysis{
    background:#06131a;

    border:1px solid rgba(255,255,255,.055);

    border-radius:14px;

    padding:17px;

    color:#c3ced2;

    font-size:13px;

    line-height:2.1;

    white-space:pre-line;
}


/* =========================================================
   UPDATE
========================================================= */

.stock-updated{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-top:20px;

    padding-top:15px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#75878e;

    font-size:11px;
}

.stock-updated strong{
    color:#aebcc1;
}


/* =========================================================
   NEW SEARCH BUTTON
========================================================= */

.new-search-button{
    width:100%;

    margin-top:13px;

    height:47px;

    border-radius:11px;

    border:1px solid rgba(32,200,120,.35);

    background:transparent;

    color:#20c878;

    font-family:'Cairo',sans-serif;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.new-search-button:hover{
    background:rgba(32,200,120,.07);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .watch-page{
        padding:38px 15px 65px;
    }

    .watch-hero{
        margin-bottom:25px;
    }

    .watch-hero h1{
        font-size:31px;
    }

    .watch-hero p{
        font-size:15px;
        line-height:1.9;
    }

    .watch-search{
        padding:18px;
        border-radius:19px;
    }

    .watch-search-form{
        grid-template-columns:1fr;
    }

    .watch-search-input,
    .watch-search-button{
        height:50px;
    }

    .stock-card{
        padding:18px;
        border-radius:19px;
    }

    .stock-header{
        align-items:flex-start;

        gap:15px;
    }

    .stock-symbol{
        font-size:25px;
    }

    .stock-name{
        font-size:14px;
    }

    .stock-price-area{
        min-width:0;
    }

    .stock-price{
        font-size:24px;
    }

    .stock-details{
        grid-template-columns:
            repeat(2,1fr);
    }

    .stock-levels{
        grid-template-columns:1fr;
    }

    .stock-plan{
        grid-template-columns:1fr 1fr;
    }

    .stock-updated{
        align-items:flex-start;

        flex-direction:column;
    }

}


@media(max-width:480px){

    .stock-header{
        flex-direction:column;
    }

    .stock-price-area{
        width:100%;

        text-align:right;
    }

    .stock-price{
        font-size:26px;
    }

    .stock-plan{
        grid-template-columns:1fr;
    }

}

</style>

<!-- =========================================================
     HEADER
========================================================= -->

<div id="site-header"></div>


<main>

<section class="watch-page">

<div class="wrap">


<!-- =========================================================
     HERO
========================================================= -->

<div class="watch-hero">

    <div class="watch-eyebrow">
        📊 STOCK SEARCH • AL FAYED STOCKS
    </div>

    <h1>
        🔎 البحث عن الأسهم السعودية
    </h1>

    <p>
        ابحث باسم السهم أو رمزه لمعرفة السعر الحالي
        وبيانات التداول والمستويات الفنية والتحليل.
    </p>

</div>


<!-- =========================================================
     SEARCH
========================================================= -->

<div class="watch-search">

    <div class="watch-search-title">
        🔎 ابحث عن سهم
    </div>

    <div class="watch-search-form">

        <input
            id="watchInput"
            class="watch-search-input"
            type="text"
            autocomplete="off"
            placeholder="مثال: 2222 أو أرامكو أو 1120 أو الراجحي"
        >

        <button
            id="searchButton"
            class="watch-search-button"
            type="button"
            onclick="searchStock()"
        >
            بحث عن السهم
        </button>

    </div>

</div>


<!-- =========================================================
     HINT
========================================================= -->

<div class="watch-hint">

    💡 يمكنك البحث باستخدام
    <strong>اسم السهم</strong>
    أو
    <strong>رمز السهم</strong>.

    مثال:
    <strong>2222</strong>
    أو
    <strong>أرامكو</strong>

</div>


<!-- =========================================================
     STATUS
========================================================= -->

<div
    id="searchStatus"
    class="search-status"
></div>


<!-- =========================================================
     RESULTS
========================================================= -->

<div
    id="watchList"
    class="watch-results"
>

    <div class="watch-empty">

        <div class="watch-empty-icon">
            🔎
        </div>

        <div class="watch-empty-title">
            ابحث عن سهم
        </div>

        <div class="watch-empty-text">
            اكتب اسم السهم أو رمزه ثم اضغط على زر البحث.
        </div>

    </div>

</div>


</div>

</section>

</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<div id="site-footer"></div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;


try{

    if(
        window.supabase &&
        window.SUPABASE_URL &&
        window.SUPABASE_ANON_KEY
    ){

        supabaseClient =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            );

    }

}catch(error){

    console.error(
        'Supabase initialization error:',
        error
    );

}


/* =========================================================
   ARABIC NORMALIZATION
========================================================= */

function normalizeArabic(value){

    return String(value || '')
        .toLowerCase()
        .replace(/[أإآ]/g,'ا')
        .replace(/ى/g,'ي')
        .replace(/ة/g,'ه')
        .replace(/ؤ/g,'و')
        .replace(/ئ/g,'ي')
        .replace(/[\u064B-\u065F\u0670]/g,'')
        .replace(/\s+/g,' ')
        .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? '')
        .replace(
            /[&<>'"]/g,
            function(char){

                return {

                    '&':'&amp;',
                    '<':'&lt;',
                    '>':'&gt;',
                    "'":'&#39;',
                    '"':'&quot;'

                }[char];

            }
        );

}


/* =========================================================
   SEARCH
========================================================= */

async function searchStock(){

    const input =
        document.getElementById('watchInput');

    const button =
        document.getElementById('searchButton');

    const resultsBox =
        document.getElementById('watchList');

    const status =
        document.getElementById('searchStatus');


    const value =
        input.value.trim();


    if(!value){

        status.className =
            'search-status error';

        status.textContent =
            '⚠️ اكتب اسم السهم أو رمزه أولاً.';

        input.focus();

        return;

    }


    if(!supabaseClient){

        status.className =
            'search-status error';

        status.textContent =
            '❌ تعذر الاتصال بقاعدة البيانات.';

        return;

    }


    button.disabled = true;

    button.textContent =
        'جاري البحث...';


    status.className =
        'search-status loading';

    status.textContent =
        '⏳ جاري البحث عن السهم...';


    resultsBox.innerHTML='';


    try{

        const searchValue =
            normalizeArabic(value);


        const response =
            await supabaseClient
                .from('saudi_stocks')
                .select('*')
                .order(
                    'symbol',
                    {
                        ascending:true
                    }
                );


        if(response.error){

            throw response.error;

        }


        const stocks =
            response.data || [];


        const results =
            stocks.filter(
                function(stock){

                    const symbol =
                        String(
                            stock.symbol || ''
                        )
                        .toLowerCase()
                        .trim();


                    const name =
                        normalizeArabic(
                            stock.name
                        );


                    return (

                        symbol === searchValue ||

                        symbol.includes(
                            searchValue
                        ) ||

                        name.includes(
                            searchValue
                        )

                    );

                }
            );


        /* =========================================
           NOT FOUND
        ========================================= */

        if(!results.length){

            resultsBox.innerHTML=`

                <div class="watch-not-found">

                    <div class="watch-not-found-icon">
                        🔍
                    </div>

                    <div class="watch-not-found-title">
                        لم يتم العثور على السهم
                    </div>

                    <div class="watch-not-found-text">
                        جرّب كتابة اسم السهم أو الرمز بشكل مختلف.
                    </div>

                    <button
                        class="new-search-button"
                        onclick="focusSearch()"
                    >
                        🔎 البحث مرة أخرى
                    </button>

                </div>

            `;


            status.className =
                'search-status error';

            status.textContent =
                'لا توجد نتائج لهذا البحث.';


            return;

        }


        /* =========================================
           RESULTS
        ========================================= */

        resultsBox.innerHTML =
            results
                .map(renderStock)
                .join('');


        status.className =
            'search-status success';

        status.textContent =
            `✅ تم العثور على ${results.length} نتيجة`;


        window.scrollTo({
            top:
                resultsBox.offsetTop - 100,
            behavior:'smooth'
        });


    }catch(error){

        console.error(
            'Search error:',
            error
        );


        resultsBox.innerHTML=`

            <div class="watch-not-found">

                <div class="watch-not-found-icon">
                    ⚠️
                </div>

                <div class="watch-not-found-title">
                    حدث خطأ أثناء البحث
                </div>

                <div class="watch-not-found-text">
                    تعذر الوصول إلى بيانات الأسهم.
                    حاول مرة أخرى.
                </div>

                <button
                    class="new-search-button"
                    onclick="focusSearch()"
                >
                    🔄 المحاولة مرة أخرى
                </button>

            </div>

        `;


        status.className =
            'search-status error';

        status.textContent =
            '❌ حدث خطأ أثناء الاتصال بقاعدة البيانات.';


    }finally{

        button.disabled = false;

        button.textContent =
            'بحث عن السهم';

    }

}


/* =========================================================
   RENDER STOCK
========================================================= */

function renderStock(stock){

    const price =
        formatNumber(
            stock.price
        );


    const change =
        Number(
            stock.change_percent
        );


    let changeClass =
        'stock-change flat';


    let arrow =
        '•';


    if(change > 0){

        changeClass =
            'stock-change';

        arrow =
            '▲';

    }else if(change < 0){

        changeClass =
            'stock-change down';

        arrow =
            '▼';

    }


    const changeValue =
        formatSignedNumber(
            stock.change_value
        );


    const changePercent =
        formatSignedPercent(
            stock.change_percent
        );


    return `

    <article class="stock-card">


        <!-- =========================================
             HEADER
        ========================================= -->

        <div class="stock-header">

            <div>

                <div class="stock-market">
                    🇸🇦 السوق السعودي
                </div>

                <div class="stock-symbol">
                    ${escapeHTML(stock.symbol)}
                </div>

                <div class="stock-name">
                    ${escapeHTML(stock.name)}
                </div>

                ${
                    stock.sector
                    ?
                    `
                    <div class="stock-sector">
                        ${escapeHTML(stock.sector)}
                    </div>
                    `
                    :
                    ''
                }

            </div>


            <div class="stock-price-area">

                <div class="stock-price-label">
                    السعر الحالي
                </div>

                <div class="stock-price">
                    ${price}
                </div>

                <div class="${changeClass}">

                    ${arrow}

                    ${
                        changeValue !== '—'
                        ?
                        changeValue
                        :
                        ''
                    }

                    ${
                        changePercent !== '—'
                        ?
                        ` (${changePercent}%)`
                        :
                        ''
                    }

                </div>

            </div>

        </div>


        <!-- =========================================
             TRADING DATA
        ========================================= -->

        <div class="stock-section-title">
            📊 بيانات التداول
        </div>


        <div class="stock-details">

            ${detailBox(
                'الافتتاح',
                formatNumber(stock.open_price)
            )}

            ${detailBox(
                'أعلى سعر',
                formatNumber(stock.high_price)
            )}

            ${detailBox(
                'أدنى سعر',
                formatNumber(stock.low_price)
            )}

            ${detailBox(
                'الإغلاق السابق',
                formatNumber(stock.previous_close)
            )}

            ${detailBox(
                'حجم التداول',
                formatVolume(stock.volume)
            )}

            ${detailBox(
                'التغير',
                changeValue
            )}

            ${detailBox(
                'نسبة التغير',
                changePercent === '—'
                ? '—'
                : changePercent+'%'
            )}

            ${detailBox(
                'رمز السهم',
                stock.symbol
            )}

        </div>


        <!-- =========================================
             LEVELS
        ========================================= -->

        <div class="stock-section-title">
            📈 المستويات الفنية
        </div>


        <div class="stock-levels">


            <div class="stock-level-box">

                <div class="stock-level-heading support">
                    🟢 مناطق الدعم
                </div>

                <div class="stock-level-items">

                    ${
                        levelValue(
                            stock.support_1
                        )
                    }

                    ${
                        levelValue(
                            stock.support_2
                        )
                    }

                    ${
                        !stock.support_1 &&
                        !stock.support_2
                        ?
                        '<span style="color:#82939a;font-size:12px;">لا توجد بيانات</span>'
                        :
                        ''
                    }

                </div>

            </div>


            <div class="stock-level-box">

                <div class="stock-level-heading resistance">
                    🟡 مناطق المقاومة
                </div>

                <div class="stock-level-items">

                    ${
                        levelValue(
                            stock.resistance_1
                        )
                    }

                    ${
                        levelValue(
                            stock.resistance_2
                        )
                    }

                    ${
                        !stock.resistance_1 &&
                        !stock.resistance_2
                        ?
                        '<span style="color:#82939a;font-size:12px;">لا توجد بيانات</span>'
                        :
                        ''
                    }

                </div>

            </div>


        </div>


        <!-- =========================================
             PLAN
        ========================================= -->

        <div class="stock-section-title">
            🎯 خطة السهم
        </div>


        <div class="stock-plan">


            <div class="stock-plan-box target">

                <span class="stock-plan-label">
                    🎯 الهدف
                </span>

                <div class="stock-plan-value">

                    ${formatNumber(
                        stock.target
                    )}

                </div>

            </div>


            <div class="stock-plan-box stop">

                <span class="stock-plan-label">
                    🛑 وقف الخسارة
                </span>

                <div class="stock-plan-value">

                    ${formatNumber(
                        stock.stop_loss
                    )}

                </div>

            </div>


        </div>


        <!-- =========================================
             ANALYSIS
        ========================================= -->

        <div class="stock-section-title">
            📝 التحليل الفني
        </div>


        <div class="stock-analysis">

            ${
                stock.analysis
                ?
                escapeHTML(
                    stock.analysis
                )
                :
                'لا يوجد تحليل فني مضاف لهذا السهم حاليًا.'
            }

        </div>


        <!-- =========================================
             UPDATE
        ========================================= -->

        <div class="stock-updated">

            <div>

                🕐 آخر تحديث:

                <strong>
                    ${formatDateTime(
                        stock.updated_at
                    )}
                </strong>

            </div>


            <div>

                البيانات من
                <strong>
                    Al Fayed Stocks
                </strong>

            </div>

        </div>


        <!-- =========================================
             NEW SEARCH
        ========================================= -->

        <button
            class="new-search-button"
            onclick="focusSearch()"
        >
            🔎 البحث عن سهم آخر
        </button>


    </article>

    `;

}


/* =========================================================
   DETAIL BOX
========================================================= */

function detailBox(
    label,
    value
){

    return `

        <div class="stock-detail">

            <div class="stock-detail-label">
                ${label}
            </div>

            <div class="stock-detail-value">
                ${escapeHTML(
                    String(
                        value ?? '—'
                    )
                )}
            </div>

        </div>

    `;

}


/* =========================================================
   LEVEL
========================================================= */

function levelValue(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '';

    }


    return `

        <div class="stock-level">

            ${formatNumber(value)}

        </div>

    `;

}


/* =========================================================
   NUMBER
========================================================= */

function formatNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return escapeHTML(
            String(value)
        );

    }


    return number.toLocaleString(
        'en-US',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   SIGNED NUMBER
========================================================= */

function formatSignedNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return escapeHTML(
            String(value)
        );

    }


    if(number > 0){

        return '+'+
            number.toLocaleString(
                'en-US',
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );

    }


    return number.toLocaleString(
        'en-US',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   SIGNED PERCENT
========================================================= */

function formatSignedPercent(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return escapeHTML(
            String(value)
        );

    }


    if(number > 0){

        return '+'+
            number.toFixed(2);

    }


    return number.toFixed(2);

}


/* =========================================================
   VOLUME
========================================================= */

function formatVolume(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(
        !Number.isFinite(number)
    ){

        return escapeHTML(
            String(value)
        );

    }


    return number.toLocaleString(
        'en-US'
    );

}


/* =========================================================
   DATE + TIME
========================================================= */

function formatDateTime(value){

    if(!value){

        return '—';

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return '—';

    }


    return date.toLocaleString(
        'ar-EG',
        {
            year:'numeric',
            month:'2-digit',
            day:'2-digit',
            hour:'2-digit',
            minute:'2-digit'
        }
    );

}


/* =========================================================
   FOCUS SEARCH
========================================================= */

function focusSearch(){

    const input =
        document.getElementById(
            'watchInput'
        );


    input.value='';

    input.focus();


    const results =
        document.getElementById(
            'watchList'
        );


    results.innerHTML=`

        <div class="watch-empty">

            <div class="watch-empty-icon">
                🔎
            </div>

            <div class="watch-empty-title">
                ابحث عن سهم
            </div>

            <div class="watch-empty-text">
                اكتب اسم السهم أو رمزه ثم اضغط على زر البحث.
            </div>

        </div>

    `;


    document
        .getElementById(
            'searchStatus'
        )
        .textContent='';

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById('watchInput')
    .addEventListener(
        'keydown',
        function(event){

            if(
                event.key === 'Enter'
            ){

                searchStock();

            }

        }
    );


</script>


</body>
</html>
