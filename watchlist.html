<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>بحث الأسهم | Al Fayed Stocks</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =========================
   STOCK SEARCH PAGE
========================= */

.watch-page{
    padding:55px 0 80px;
    min-height:70vh;
}

.watch-hero{
    text-align:center;
    margin-bottom:32px;
}

.watch-hero .eyebrow{
    color:#d8a94c;
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
    margin-bottom:10px;
}

.watch-hero h1{
    margin:0;
    color:#142136;
    font-size:42px;
    font-weight:900;
    line-height:1.4;
}

.watch-hero p{
    margin:12px auto 0;
    max-width:720px;
    color:#273445;
    font-size:20px;
    line-height:2;
}

/* =========================
   SEARCH BOX
========================= */

.watch-add{
    max-width:850px;
    margin:0 auto 18px;
    background:#0b2028;
    border:1px solid rgba(32,200,120,.22);
    border-radius:24px;
    padding:25px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.watch-add-title{
    color:#fff;
    font-size:21px;
    font-weight:800;
    margin-bottom:15px;
}

.watch-add-form{
    display:grid;
    grid-template-columns:1fr auto;
    gap:12px;
}

.watch-add input{
    width:100%;
    height:54px;
    box-sizing:border-box;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.16);
    background:#06131a;
    color:#fff;
    padding:0 17px;
    font-family:'Cairo',sans-serif;
    font-size:16px;
    outline:none;
}

.watch-add input::placeholder{
    color:#82939a;
}

.watch-add input:focus{
    border-color:#20c878;
}

.watch-add button{
    height:54px;
    border:0;
    border-radius:12px;
    padding:0 28px;
    background:#d8a94c;
    color:#06131a;
    font-family:'Cairo',sans-serif;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.watch-add button:hover{
    transform:translateY(-2px);
}

/* =========================
   INFO
========================= */

.watch-info{
    max-width:850px;
    margin:0 auto 30px;
    text-align:center;
    color:#42515c;
    font-size:15px;
    line-height:2;
}

.watch-info span{
    color:#20a96a;
    font-weight:800;
}

/* =========================
   STATUS
========================= */

.search-status{
    max-width:1000px;
    margin:0 auto 18px;
    text-align:center;
    font-size:15px;
    font-weight:700;
    min-height:25px;
}

.search-status.loading{
    color:#d8a94c;
}

.search-status.success{
    color:#20c878;
}

.search-status.error{
    color:#ff6868;
}

/* =========================
   STOCK RESULT
========================= */

.watch-list{
    max-width:1000px;
    margin:auto;
}

.watch-empty{
    background:#0b2028;
    border-radius:24px;
    padding:45px 25px;
    text-align:center;
    color:#9eafb5;
    border:1px solid rgba(255,255,255,.07);
}

.watch-empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

/* =========================
   STOCK CARD
========================= */

.watch-card{
    background:#0b2028;
    border:1px solid rgba(255,255,255,.07);
    border-radius:24px;
    padding:25px;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.watch-card::before{
    content:"";
    position:absolute;
    top:0;
    right:0;
    left:0;
    height:3px;
    background:#20c878;
}

.watch-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
}

.watch-market{
    color:#20c878;
    font-size:14px;
    font-weight:800;
    margin-bottom:5px;
}

.watch-symbol{
    color:#fff;
    font-size:30px;
    font-weight:900;
}

.watch-name{
    color:#aebdc2;
    font-size:16px;
    margin-top:3px;
}

.watch-sector{
    display:inline-block;
    margin-top:9px;
    padding:4px 10px;
    border-radius:20px;
    background:rgba(216,169,76,.10);
    color:#d8a94c;
    font-size:12px;
    font-weight:700;
}

.watch-price-box{
    text-align:left;
}

.watch-price{
    font-size:32px;
    font-weight:900;
    color:#fff;
}

.watch-change{
    display:inline-block;
    margin-top:6px;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:800;
    background:rgba(32,200,120,.10);
    color:#20c878;
}

.watch-change.down{
    color:#ff6868;
    background:rgba(255,104,104,.10);
}

/* =========================
   DETAILS
========================= */

.watch-section-title{
    color:#fff;
    font-size:17px;
    font-weight:800;
    margin:22px 0 12px;
    padding-right:10px;
    border-right:3px solid #20c878;
}

.watch-details{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.watch-detail{
    background:#06131a;
    border:1px solid rgba(255,255,255,.06);
    border-radius:12px;
    padding:12px 8px;
    text-align:center;
}

.watch-detail span{
    display:block;
    color:#82939a;
    font-size:11px;
    margin-bottom:5px;
}

.watch-detail b{
    color:#fff;
    font-size:14px;
}

/* =========================
   SUPPORT / RESISTANCE
========================= */

.levels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.level-box{
    background:#06131a;
    border-radius:14px;
    padding:15px;
    border:1px solid rgba(255,255,255,.06);
}

.level-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:10px;
}

.level-title.support{
    color:#20c878;
}

.level-title.resistance{
    color:#d8a94c;
}

.level-values{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.level-value{
    background:#0b2028;
    border:1px solid rgba(255,255,255,.07);
    border-radius:9px;
    padding:6px 10px;
    color:#fff;
    font-size:13px;
    font-weight:800;
}

/* =========================
   ANALYSIS
========================= */

.analysis-box{
    background:#06131a;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:17px;
    color:#c2cdd1;
    line-height:2;
    font-size:14px;
}

.trade-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
}

.trade-item{
    background:#06131a;
    border-radius:12px;
    padding:13px;
    text-align:center;
}

.trade-item span{
    display:block;
    color:#82939a;
    font-size:11px;
    margin-bottom:5px;
}

.trade-item b{
    font-size:17px;
}

.trade-target b{
    color:#20c878;
}

.trade-stop b{
    color:#ff6868;
}

/* =========================
   EMPTY / NOT FOUND
========================= */

.not-found{
    background:#0b2028;
    border:1px solid rgba(255,104,104,.15);
    border-radius:24px;
    padding:40px 25px;
    text-align:center;
    color:#9eafb5;
}

.not-found-icon{
    font-size:42px;
    margin-bottom:10px;
}

.not-found-title{
    color:#fff;
    font-size:19px;
    font-weight:800;
    margin-bottom:7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .watch-page{
        padding:38px 15px 65px;
    }

    .watch-hero{
        margin-bottom:25px;
    }

    .watch-hero .eyebrow{
        font-size:13px;
    }

    .watch-hero h1{
        font-size:31px;
    }

    .watch-hero p{
        font-size:16px;
        line-height:1.9;
    }

    .watch-add{
        padding:18px;
        border-radius:20px;
    }

    .watch-add-title{
        font-size:18px;
    }

    .watch-add-form{
        grid-template-columns:1fr;
    }

    .watch-add input,
    .watch-add button{
        height:50px;
    }

    .watch-card{
        padding:18px;
        border-radius:20px;
    }

    .watch-card-top{
        align-items:flex-start;
    }

    .watch-symbol{
        font-size:24px;
    }

    .watch-price{
        font-size:24px;
    }

    .watch-details{
        grid-template-columns:repeat(2,1fr);
    }

    .levels{
        grid-template-columns:1fr;
    }

    .trade-box{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>


<body>

<!-- HEADER -->
<div id="site-header"></div>


<main>

<section class="watch-page">

<div class="wrap">


<!-- ================= HERO ================= -->

<div class="watch-hero">

<div class="eyebrow">
STOCK SEARCH • AL FAYED STOCKS
</div>

<h1>
🔎 البحث عن الأسهم
</h1>

<p>
اكتب اسم السهم أو رمزه للبحث عن تفاصيله وبياناته
من قاعدة بيانات Al Fayed Stocks.
</p>

</div>


<!-- ================= SEARCH ================= -->

<div class="watch-add">

<div class="watch-add-title">
🔎 ابحث عن سهم
</div>

<div class="watch-add-form">

<input
id="watchInput"
type="text"
autocomplete="off"
placeholder="مثال: 2222 أو أرامكو أو 1120 أو الراجحي">

<button id="searchButton" onclick="searchStock()">
بحث عن السهم
</button>

</div>

</div>


<!-- ================= INFO ================= -->

<div class="watch-info">

💡 يمكنك البحث باستخدام <span>اسم السهم</span>
أو <span>رمز السهم</span>.

</div>


<!-- ================= STATUS ================= -->

<div id="searchStatus" class="search-status"></div>


<!-- ================= RESULT ================= -->

<div id="watchList" class="watch-list">

<div class="watch-empty">

<div class="watch-empty-icon">
🔎
</div>

<div style="
color:#fff;
font-size:19px;
font-weight:800;
margin-bottom:7px;
">
ابحث عن سهم
</div>

<div>
اكتب اسم السهم أو رمزه ثم اضغط بحث.
</div>

</div>

</div>


</div>

</section>

</main>


<!-- FOOTER -->
<div id="site-footer"></div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="app.js"></script>


<script>

/* =====================================
   SUPABASE CLIENT
===================================== */

let supabaseClient = null;

try {

    if (
        window.supabase &&
        window.SUPABASE_URL &&
        window.SUPABASE_ANON_KEY
    ) {

        supabaseClient =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_ANON_KEY
            );

    }

} catch(error) {

    console.error(
        'Supabase initialization error:',
        error
    );

}


/* =====================================
   SEARCH STOCK
===================================== */

async function searchStock(){

    const input =
        document.getElementById('watchInput');

    const button =
        document.getElementById('searchButton');

    const box =
        document.getElementById('watchList');

    const status =
        document.getElementById('searchStatus');


    const value =
        input.value.trim();


    if(!value){

        input.focus();

        status.className =
            'search-status error';

        status.textContent =
            'اكتب اسم السهم أو رمزه أولاً.';

        return;

    }


    if(!supabaseClient){

        status.className =
            'search-status error';

        status.textContent =
            'تعذر الاتصال بقاعدة البيانات. تأكد من supabase-config.js';

        return;

    }


    button.disabled = true;

    button.textContent = 'جاري البحث...';

    status.className =
        'search-status loading';

    status.textContent =
        'جاري البحث عن السهم...';


    box.innerHTML = '';


    try {


        /*
         * البحث بالرمز أو الاسم
         */

        const cleanValue =
            value.replace(/%/g,'').trim();


        const { data, error } =
            await supabaseClient
            .from('saudi_stocks')
            .select('*')
            .or(
                `symbol.ilike.%${cleanValue}%,name.ilike.%${cleanValue}%`
            )
            .limit(10);


        if(error){

            console.error(error);

            throw error;

        }


        if(!data || !data.length){

            box.innerHTML = `

                <div class="not-found">

                    <div class="not-found-icon">
                        🔍
                    </div>

                    <div class="not-found-title">
                        لم يتم العثور على السهم
                    </div>

                    <div>
                        جرّب كتابة اسم السهم أو الرمز بشكل مختلف.
                    </div>

                </div>

            `;

            status.className =
                'search-status error';

            status.textContent =
                'لا توجد نتائج لهذا البحث.';

            return;

        }


        /*
         * لو فيه أكثر من نتيجة
         * نعرضها كلها
         */

        box.innerHTML =
            data.map(renderStock).join('');


        status.className =
            'search-status success';

        status.textContent =
            `تم العثور على ${data.length} نتيجة`;


    } catch(error) {

        console.error(
            'Search error:',
            error
        );


        box.innerHTML = `

            <div class="not-found">

                <div class="not-found-icon">
                    ⚠️
                </div>

                <div class="not-found-title">
                    حدث خطأ أثناء البحث
                </div>

                <div>
                    حاول مرة أخرى.
                </div>

            </div>

        `;


        status.className =
            'search-status error';

        status.textContent =
            'حدث خطأ أثناء الاتصال بقاعدة البيانات.';


    } finally {

        button.disabled = false;

        button.textContent =
            'بحث عن السهم';

    }

}


/* =====================================
   RENDER STOCK
===================================== */

function renderStock(stock){

    const price =
        formatNumber(stock.price);

    const changeValue =
        formatNumber(stock.change_value);

    const changePercent =
        formatPercent(stock.change_percent);


    const isDown =
        Number(stock.change_percent) < 0;


    const changeClass =
        isDown ? 'watch-change down' : 'watch-change';


    const changeSign =
        Number(stock.change_percent) > 0 ? '+' : '';


    return `

    <article class="watch-card">

        <div class="watch-card-top">

            <div>

                <div class="watch-market">
                    🇸🇦 السوق السعودي
                </div>

                <div class="watch-symbol">
                    ${escapeHTML(stock.symbol)}
                </div>

                <div class="watch-name">
                    ${escapeHTML(stock.name)}
                </div>

                ${
                    stock.sector
                    ?
                    `
                    <div class="watch-sector">
                        ${escapeHTML(stock.sector)}
                    </div>
                    `
                    :
                    ''
                }

            </div>


            <div class="watch-price-box">

                <div class="watch-price">
                    ${price}
                </div>

                <div class="${changeClass}">

                    ${
                        changeValue !== '—'
                        ?
                        changeSign + changeValue
                        :
                        ''
                    }

                    ${
                        changePercent !== '—'
                        ?
                        ` (${changeSign}${changePercent}%)`
                        :
                        'بيانات التغير غير متوفرة'
                    }

                </div>

            </div>

        </div>


        <!-- بيانات التداول -->

        <div class="watch-section-title">
            📊 بيانات التداول
        </div>

        <div class="watch-details">

            ${detailBox('الافتتاح', stock.open_price)}

            ${detailBox('الأعلى', stock.high_price)}

            ${detailBox('الأدنى', stock.low_price)}

            ${detailBox('الإغلاق السابق', stock.previous_close)}

            ${detailBox('حجم التداول', formatVolume(stock.volume))}

            ${detailBox('آخر تحديث', formatDate(stock.updated_at))}

        </div>


        <!-- الدعم والمقاومة -->

        <div class="watch-section-title">
            📈 مستويات فنية
        </div>

        <div class="levels">

            <div class="level-box">

                <div class="level-title support">
                    🟢 مناطق الدعم
                </div>

                <div class="level-values">

                    ${levelValue(stock.support_1)}

                    ${levelValue(stock.support_2)}

                </div>

            </div>


            <div class="level-box">

                <div class="level-title resistance">
                    🟡 مناطق المقاومة
                </div>

                <div class="level-values">

                    ${levelValue(stock.resistance_1)}

                    ${levelValue(stock.resistance_2)}

                </div>

            </div>

        </div>


        <!-- المستهدف ووقف الخسارة -->

        <div class="watch-section-title">
            🎯 خطة السهم
        </div>

        <div class="trade-box">

            <div class="trade-item trade-target">

                <span>
                    المستهدف
                </span>

                <b>
                    ${formatNumber(stock.target)}
                </b>

            </div>


            <div class="trade-item trade-stop">

                <span>
                    وقف الخسارة
                </span>

                <b>
                    ${formatNumber(stock.stop_loss)}
                </b>

            </div>

        </div>


        <!-- التحليل -->

        <div class="watch-section-title">
            📝 التحليل
        </div>

        <div class="analysis-box">

            ${
                stock.analysis
                ?
                escapeHTML(stock.analysis)
                :
                'لا يوجد تحليل مضاف لهذا السهم حاليًا.'
            }

        </div>

    </article>

    `;

}


/* =====================================
   DETAIL BOX
===================================== */

function detailBox(title,value){

    return `

        <div class="watch-detail">

            <span>
                ${title}
            </span>

            <b>
                ${
                    value === null ||
                    value === undefined ||
                    value === ''
                    ?
                    '—'
                    :
                    escapeHTML(
                        String(value)
                    )
                }
            </b>

        </div>

    `;

}


/* =====================================
   LEVEL VALUE
===================================== */

function levelValue(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '';

    }


    return `

        <div class="level-value">
            ${escapeHTML(String(value))}
        </div>

    `;

}


/* =====================================
   NUMBER FORMAT
===================================== */

function formatNumber(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(Number.isNaN(number)){

        return escapeHTML(String(value));

    }


    return number.toLocaleString(
        'en-US',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================
   PERCENT
===================================== */

function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(Number.isNaN(number)){

        return escapeHTML(String(value));

    }


    return number.toFixed(2);

}


/* =====================================
   VOLUME
===================================== */

function formatVolume(value){

    if(
        value === null ||
        value === undefined ||
        value === ''
    ){

        return '—';

    }


    const number =
        Number(value);


    if(Number.isNaN(number)){

        return escapeHTML(String(value));

    }


    return number.toLocaleString('en-US');

}


/* =====================================
   DATE
===================================== */

function formatDate(value){

    if(!value){

        return '—';

    }


    try{

        const date =
            new Date(value);


        return date.toLocaleDateString(
            'ar-SA',
            {
                year:'numeric',
                month:'numeric',
                day:'numeric'
            }
        );

    }catch(error){

        return '—';

    }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value){

    return String(value ?? '')
    .replace(/[&<>'"]/g,function(c){

        return {

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'

        }[c];

    });

}


/* =====================================
   ENTER TO SEARCH
===================================== */

document
.getElementById('watchInput')
.addEventListener(
    'keydown',
    function(e){

        if(e.key === 'Enter'){

            searchStock();

        }

    }
);

</script>

</body>
</html>
