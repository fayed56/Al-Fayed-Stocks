<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التوصيات | Al Fayed Stocks</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div id="site-header"></div><main class="inner"><section class="pagehero"><div class="wrap"><div class="eyebrow">AL FAYED STOCKS — RECOMMENDATIONS</div><h1>التوصيات 🔥</h1><p>أحدث الفرص والمتابعات التي يعتمدها فريق Al Fayed Stocks للسوق السعودي والأمريكي.</p></div></section><section><div class="wrap"><div class="sectionhead"><div><div class="eyebrow">LIVE FROM SUPABASE</div><h2>آخر التوصيات</h2></div><a class="goldbtn" href="admin.html">لوحة الإدارة</a></div><div id="recGrid" class="twocol"><div class="card"><p class="muted">جاري تحميل التوصيات...</p></div></div><div id="recNote" class="muted" style="margin-top:18px"></div></div></section></main><div id="site-footer"></div><script src="app.js"></script><script>
const labels={open:'مفتوحة',watch:'مراقبة',closed:'مغلقة'};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(x){return `<article class="marketbox"><div class="eyebrow">${x.market==='saudi'?'🇸🇦 السوق السعودي':'🇺🇸 السوق الأمريكي'}</div><h3>${esc(x.name)} <small>(${esc(x.symbol)})</small></h3><p>${esc(x.note||'')}</p><div class="mini-stats"><span>الدخول <b>${x.entry??'—'}</b></span><span>الهدف <b>${x.target??'—'}</b></span><span>الوقف <b>${x.stop_loss??'—'}</b></span><span>الحالة <b>${labels[x.status]||x.status}</b></span></div></article>`}
async function loadPublic(){const box=document.getElementById('recGrid');if(!window.SUPABASE_ANON_KEY||window.SUPABASE_ANON_KEY.includes('PASTE_')){box.innerHTML='<div class="card"><h3>التوصيات</h3><p class="muted">سيتم تفعيل التوصيات المباشرة بعد وضع Publishable/Anon Key في supabase-config.js.</p></div>';return}const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);const r=await sb.from('recommendations').select('*').order('created_at',{ascending:false});if(r.error){box.innerHTML='<div class="card"><p class="muted">تعذر تحميل التوصيات حاليًا.</p></div>';return}box.innerHTML=r.data.length?r.data.map(card).join(''):'<div class="card"><h3>لا توجد توصيات منشورة حاليًا</h3><p class="muted">تابعنا لمعرفة أحدث الفرص.</p></div>';document.getElementById('recNote').textContent='يتم تحديث القائمة تلقائيًا عند إضافة توصية من لوحة الإدارة.'}
loadPublic();
</script></body></html>
