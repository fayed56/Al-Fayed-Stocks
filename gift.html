<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>مفاجأتك مستنياك 🎁 | Al Fayed Stocks</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:'Cairo',Arial,sans-serif;
  background:#06131a;
  color:#f5f7f8;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.wrap{
  width:min(760px,100%);
  background:#0b2028;
  border:1px solid #173842;
  border-radius:28px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center
}

.logo{
  font-size:20px;
  font-weight:900;
  margin-bottom:10px
}

.logo span{
  color:#20c878
}

h1{
  margin:8px 0;
  font-size:30px;
  font-weight:900
}

.sub{
  color:#a9bbc1;
  margin-bottom:22px;
  line-height:1.9
}

input{
  width:min(430px,100%);
  padding:15px;
  border-radius:14px;
  border:1px solid #31505a;
  background:#091b24;
  color:#fff;
  font-family:inherit;
  font-size:16px;
  text-align:right;
  outline:none
}

input:focus{
  border-color:#20c878
}

button{
  font:inherit
}

.primary,
.share,
.again{
  border:0;
  border-radius:14px;
  padding:13px 22px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
  transition:.2s
}

.primary,
.share{
  background:#20c878;
  color:#06131a
}

.again{
  background:transparent;
  color:#fff;
  border:1px solid #31505a
}

.primary:hover,
.share:hover,
.again:hover{
  transform:translateY(-2px)
}

.error{
  color:#ff6868;
  font-size:14px;
  margin-top:10px;
  min-height:24px
}

.boxes{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin:25px auto;
  max-width:650px
}

.box{
  min-height:125px;
  border:1px solid #244650;
  border-radius:20px;
  background:#091b24;
  color:#fff;
  cursor:pointer;
  font-size:48px;
  transition:.2s;
  font-family:inherit
}

.box:hover{
  transform:translateY(-5px);
  border-color:#20c878;
  background:#0d252e
}

.box:disabled{
  cursor:default
}

.num{
  display:block;
  font-size:13px;
  color:#9fb1b7;
  margin-top:8px
}

.result{
  display:none;
  background:#0d2a32;
  border:1px solid #20c878;
  border-radius:18px;
  padding:20px;
  font-size:20px;
  font-weight:800;
  line-height:1.8
}

.result small{
  display:block;
  color:#9fb1b7;
  font-size:13px;
  margin-top:8px;
  font-weight:500
}

.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px
}

.note{
  font-size:12px;
  color:#82979e;
  margin-top:12px
}

.visits{
  margin-top:20px;
  color:#7f969e;
  font-size:12px
}

.hidden{
  display:none!important
}

.redirect{
  margin-top:15px;
  color:#20c878;
  font-size:14px;
  font-weight:800
}

@media(max-width:620px){

  .boxes{
    grid-template-columns:repeat(2,1fr)
  }

  .box:last-child{
    grid-column:1/-1;
    max-width:190px;
    width:100%;
    justify-self:center
  }

  h1{
    font-size:25px
  }

}

</style>

</head>


<body>


<main class="wrap">


<div class="logo">
Al Fayed <span>Stocks</span>
</div>


<!-- =========================
     INTRO
========================= -->

<section id="intro">

<h1>
🎁 اختار صندوقك وخلي المفاجأة علينا!
</h1>

<div class="sub">
اكتب اسمك أولًا وبعدها هتظهر لك الصناديق 😍
</div>


<input
id="name"
maxlength="40"
placeholder="اكتب اسمك هنا 👤"
autocomplete="name"
>


<br>


<button
class="primary"
id="start"
>
ابدأ اللعبة 🎁
</button>


<div
class="error"
id="nameError"
></div>


<div class="note">
الاسم مطلوب للدخول إلى اللعبة
</div>

</section>



<!-- =========================
     GAME
========================= -->

<section
id="game"
class="hidden"
>


<h1>
أهلًا <span id="playerName"></span> 👋
</h1>


<div class="sub">
اختار صندوق واحد فقط وشوف المفاجأة 🎁
</div>


<div
class="boxes"
id="boxes"
>


<button
class="box"
data-box="1"
>
🎁
<span class="num">
الصندوق 1
</span>
</button>


<button
class="box"
data-box="2"
>
🎁
<span class="num">
الصندوق 2
</span>
</button>


<button
class="box"
data-box="3"
>
🎁
<span class="num">
الصندوق 3
</span>
</button>


<button
class="box"
data-box="4"
>
🎁
<span class="num">
الصندوق 4
</span>
</button>


<button
class="box"
data-box="5"
>
🎁
<span class="num">
الصندوق 5
</span>
</button>


</div>



<!-- RESULT -->

<div
class="result"
id="result"
>

<div id="resultText"></div>


<small>
جاري تحويلك إلى واتساب 🎁
</small>


<div
class="redirect"
id="redirectText"
>
📲 جاري فتح واتساب...
</div>


<div class="actions">

<button
class="share"
id="shareWhatsapp"
>
📱 فتح واتساب الآن
</button>


<button
class="again"
id="again"
>
🔄 تجربة جديدة
</button>

</div>

</div>


</section>


<div
class="visits"
id="visits"
></div>


</main>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let supabaseClient = null;

let visitorId = null;

let playerName = '';

let selectedBox = null;

let selectedResult = '';



/* =========================================================
   SUPABASE
========================================================= */

function initSupabase(){

  try{

    if(
      !window.SUPABASE_URL ||
      !window.SUPABASE_ANON_KEY
    ){

      console.error(
        'Supabase config غير موجود'
      );

      return false;

    }


    supabaseClient =
      window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );


    return true;

  }catch(error){

    console.error(
      'Supabase init error:',
      error
    );

    return false;

  }

}



/* =========================================================
   VISITOR ID
========================================================= */

function getVisitorId(){

  const key =
    'alfayed_gift_visitor_id';


  let id =
    localStorage.getItem(key);


  if(!id){

    id =
      'visitor_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .substring(2,10);


    localStorage.setItem(
      key,
      id
    );

  }


  return id;

}



/* =========================================================
   INSERT EVENT
========================================================= */

async function logEvent(
  eventType,
  data = {}
){

  try{

    if(!supabaseClient){

      console.error(
        'Supabase غير متصل'
      );

      return {
        success:false
      };

    }


    const row = {

      event_type:
        eventType,

      visitor_id:
        visitorId,

      player_name:
        data.player_name ||
        playerName ||
        null,

      box_number:
        data.box_number ??
        null,

      prize:
        data.prize ||
        null

    };


    const {error} =
      await supabaseClient
        .from('gift_game_events')
        .insert(row);


    if(error){

      console.error(
        'Gift event error:',
        error
      );

      return {
        success:false,
        error:error
      };

    }


    console.log(
      'Gift event saved:',
      eventType
    );


    return {
      success:true
    };


  }catch(error){

    console.error(
      'Gift event exception:',
      error
    );

    return {
      success:false,
      error:error
    };

  }

}



/* =========================================================
   START VISITOR
========================================================= */

async function registerVisitor(){

  visitorId =
    getVisitorId();


  console.log(
    'Visitor ID:',
    visitorId
  );

}



/* =========================================================
   START GAME
========================================================= */

async function startGame(){

  const input =
    document.getElementById(
      'name'
    );


  const error =
    document.getElementById(
      'nameError'
    );


  const value =
    input.value.trim();


  error.textContent = '';


  if(!value){

    error.textContent =
      '⚠️ من فضلك اكتب اسمك أولًا.';

    input.focus();

    return;

  }


  if(value.length < 2){

    error.textContent =
      '⚠️ اكتب اسمًا صحيحًا.';

    input.focus();

    return;

  }


  playerName =
    value;


  document.getElementById(
    'playerName'
  ).textContent =
    playerName;


  document.getElementById(
    'intro'
  ).classList.add(
    'hidden'
  );


  document.getElementById(
    'game'
  ).classList.remove(
    'hidden'
  );


  /*
    تسجيل بداية اللعبة
    داخل gift_game_events
  */

  await logEvent(
    'start',
    {
      player_name:
        playerName
    }
  );

}



/* =========================================================
   THE FIVE PRIZES
========================================================= */

const prizes = {

  1:
    '🎉 مبروك! حصلت على خصم 20% على سعر الاشتراك.',

  2:
    '🎁 مبروك! حصلت على أسبوع مجاني على باقة الشهر.',

  3:
    '⭐ مبروك! حصلت على سهم مجاني من باقة الـ Standard.',

  4:
    '👑 مبروك! حصلت على سهم مجاني من باقة الـ VIP.',

  5:
    '📊 مبروك! حصلت على سهم للمتابعة.'

};



/* =========================================================
   WHATSAPP MESSAGE
========================================================= */

function getWhatsappUrl(){

  const phone =
    '966575944806';


  const message =
`🎁 مفاجأة Al Fayed Stocks

👤 الاسم: ${playerName}

🎁 الصندوق: ${selectedBox}

🏆 المفاجأة:
${selectedResult}

أرغب في الاستفادة من المفاجأة الخاصة بي.`;



  return (
    'https://wa.me/' +
    phone +
    '?text=' +
    encodeURIComponent(
      message
    )
  );

}



/* =========================================================
   WHATSAPP
========================================================= */

async function shareWhatsapp(){

  if(
    !playerName ||
    !selectedResult
  ){

    return;

  }


  /*
    تسجيل مشاركة واتساب
  */

  await logEvent(
    'share',
    {
      player_name:
        playerName,

      box_number:
        selectedBox,

      prize:
        selectedResult

    }
  );


  window.location.href =
    getWhatsappUrl();

}



/* =========================================================
   CHOOSE BOX
========================================================= */

async function chooseBox(
  button
){

  if(
    selectedBox !== null
  ){

    return;

  }


  selectedBox =
    Number(
      button.dataset.box
    );


  selectedResult =
    prizes[selectedBox];


  /*
    تعطيل كل الصناديق
  */

  const buttons =
    document.querySelectorAll(
      '.box'
    );


  buttons.forEach(
    function(item){

      item.disabled =
        true;

    }
  );


  button.innerHTML =
    `
      🎉
      <span class="num">
        اختيارك
      </span>
    `;


  /*
    إظهار النتيجة
  */

  document.getElementById(
    'resultText'
  ).textContent =
    selectedResult;


  document.getElementById(
    'result'
  ).style.display =
    'block';


  /*
    تسجيل اختيار الصندوق
  */

  const playResult =
    await logEvent(
      'play',
      {
        player_name:
          playerName,

        box_number:
          selectedBox,

        prize:
          selectedResult

      }
    );


  /*
    تسجيل share مباشرة
    لأن التحويل إلى واتساب تلقائي
  */

  const shareResult =
    await logEvent(
      'share',
      {
        player_name:
          playerName,

        box_number:
          selectedBox,

        prize:
          selectedResult

      }
    );


  /*
    تجهيز التحويل
  */

  const whatsappUrl =
    getWhatsappUrl();


  document.getElementById(
    'redirectText'
  ).textContent =
    '📲 جاري تحويلك إلى واتساب...';


  /*
    تحويل تلقائي
    بعد لحظة قصيرة حتى يرى العميل النتيجة
  */

  setTimeout(
    function(){

      window.location.href =
        whatsappUrl;

    },
    1200
  );


  /*
    التمرير للنتيجة
  */

  window.scrollTo({

    top:
      document.getElementById(
        'result'
      ).offsetTop - 30,

    behavior:
      'smooth'

  });

}



/* =========================================================
   PLAY AGAIN
========================================================= */

function playAgain(){

  selectedBox =
    null;

  selectedResult =
    '';


  document.getElementById(
    'result'
  ).style.display =
    'none';


  document
    .querySelectorAll('.box')
    .forEach(
      function(button){

        button.disabled =
          false;


        button.innerHTML =
          `
            🎁
            <span class="num">
              الصندوق ${button.dataset.box}
            </span>
          `;

      }
    );

}



/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById('start')
  .addEventListener(
    'click',
    startGame
  );


document
  .getElementById('name')
  .addEventListener(
    'keydown',
    function(event){

      if(
        event.key === 'Enter'
      ){

        startGame();

      }

    }
  );



document
  .querySelectorAll('.box')
  .forEach(
    function(button){

      button.addEventListener(
        'click',
        function(){

          chooseBox(
            button
          );

        }
      );

    }
  );



document
  .getElementById(
    'shareWhatsapp'
  )
  .addEventListener(
    'click',
    shareWhatsapp
  );



document
  .getElementById('again')
  .addEventListener(
    'click',
    playAgain
  );



/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    initSupabase();

    registerVisitor();

  }
);

</script>

</body>

</html>
