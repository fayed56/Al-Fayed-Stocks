<!doctype html>
<html lang="ar" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>مفاجأتك مستنياك 🎁 | Al Fayed Stocks</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Cairo',Arial,sans-serif;
background:#06131a;
color:#f5f7f8;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.wrap{
width:min(760px,100%);
background:#0b2028;
border:1px solid #173842;
border-radius:28px;
padding:28px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
text-align:center;
}

.logo{
font-size:20px;
font-weight:900;
margin-bottom:10px;
}

.logo span{
color:#20c878;
}

h1{
margin:8px 0;
font-size:30px;
font-weight:900;
}

.sub{
color:#a9bbc1;
margin-bottom:22px;
}

input{
width:min(430px,100%);
padding:15px;
border-radius:14px;
border:1px solid #31505a;
background:#091b24;
color:#fff;
font-family:inherit;
font-size:16px;
text-align:right;
outline:none;
}

input:focus{
border-color:#20c878;
}

button{
font:inherit;
}

.primary,
.share,
.again{
border:0;
border-radius:14px;
padding:13px 22px;
font-weight:800;
cursor:pointer;
margin-top:12px;
transition:.2s;
}

.primary,
.share{
background:#20c878;
color:#06131a;
}

.again{
background:transparent;
color:#fff;
border:1px solid #31505a;
}

.primary:hover,
.share:hover,
.again:hover{
transform:translateY(-2px);
}

.error{
color:#ff6868;
font-size:14px;
margin-top:10px;
min-height:24px;
}

.boxes{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin:25px auto;
max-width:650px;
}

.box{
min-height:125px;
border:1px solid #244650;
border-radius:20px;
background:#091b24;
color:#fff;
cursor:pointer;
font-size:48px;
transition:.2s;
font-family:inherit;
}

.box:hover{
transform:translateY(-5px);
border-color:#20c878;
background:#0d252e;
}

.box:disabled{
cursor:default;
}

.num{
display:block;
font-size:13px;
color:#9fb1b7;
margin-top:8px;
}

.result{
display:none;
background:#0d2a32;
border:1px solid #20c878;
border-radius:18px;
padding:20px;
font-size:20px;
font-weight:800;
line-height:1.8;
}

.result small{
display:block;
color:#9fb1b7;
font-size:13px;
margin-top:8px;
font-weight:500;
}

.actions{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.note{
font-size:12px;
color:#82979e;
margin-top:12px;
}

.whatsapp-note{
margin-top:15px;
font-size:13px;
color:#20c878;
}

.visits{
margin-top:20px;
color:#7f969e;
font-size:12px;
}

.hidden{
display:none!important;
}

@media(max-width:620px){

.boxes{
grid-template-columns:repeat(2,1fr);
}

.box:last-child{
grid-column:1/-1;
max-width:190px;
width:100%;
justify-self:center;
}

h1{
font-size:25px;
}

}

</style>

</head>

<body>

<main class="wrap">

<div class="logo">
Al Fayed <span>Stocks</span>
</div>


<!-- البداية -->

<section id="intro">

<h1>
🎁 اختار صندوقك وخلي المفاجأة علينا!
</h1>

<div class="sub">
اكتب اسمك أولًا وبعدها هتظهر لك الصناديق 😍
</div>

<input
id="name"
maxlength="40"
placeholder="اكتب اسمك هنا 👤"
autocomplete="name"
>

<br>

<button
class="primary"
id="start">

ابدأ اللعبة 🎁

</button>

<div
class="error"
id="nameError">
</div>

<div class="note">
الاسم مطلوب للدخول إلى اللعبة
</div>

</section>


<!-- اللعبة -->

<section
id="game"
class="hidden">

<h1>
أهلًا <span id="playerName"></span> 👋
</h1>

<div class="sub">
اختار صندوق واحد فقط وشوف هديتك 🎁
</div>


<div
class="boxes"
id="boxes">

<button
class="box"
data-box="1">

🎁

<span class="num">
الصندوق 1
</span>

</button>


<button
class="box"
data-box="2">

🎁

<span class="num">
الصندوق 2
</span>

</button>


<button
class="box"
data-box="3">

🎁

<span class="num">
الصندوق 3
</span>

</button>


<button
class="box"
data-box="4">

🎁

<span class="num">
الصندوق 4
</span>

</button>


<button
class="box"
data-box="5">

🎁

<span class="num">
الصندوق 5
</span>

</button>

</div>


<!-- النتيجة -->

<div
class="result"
id="result">

<div
id="resultText">
</div>

<small>
سيتم تحويلك تلقائيًا إلى واتساب للاستفادة من هديتك 🎁
</small>

<div class="whatsapp-note">
📱 جاري فتح واتساب...
</div>

<div class="actions">

<button
class="share"
id="shareWhatsapp">

📱 فتح واتساب

</button>

<button
class="again"
id="again">

🔄 تجربة جديدة

</button>

</div>

</div>

</section>


<div
class="visits"
id="visits">
</div>

</main>


<script>


/* ================= المتغيرات ================= */

let supabaseClient = null;

let visitorId = null;

let playerName = "";

let selectedBox = null;

let selectedPrize = "";


/* ================= إنشاء معرف الزائر ================= */

function createVisitorToken(){

return 'visitor_' +
Date.now() +
'_' +
Math.random()
.toString(36)
.substring(2,10);

}


/* ================= تسجيل الزائر ================= */

async function registerVisitor(){

try{

if(
!window.SUPABASE_URL ||
!window.SUPABASE_ANON_KEY
){

console.error(
"Supabase config غير موجود"
);

return;

}


supabaseClient =
window.supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_ANON_KEY
);


const token =
createVisitorToken();


const {
data,
error
} =
await supabaseClient
.from("game_visitors")
.insert({

visitor_token:token,

whatsapp_shared:false

})
.select("id")
.single();


if(error){

console.error(
"Visitor insert error:",
error
);

return;

}


if(data){

visitorId =
data.id;

}


console.log(
"Visitor registered:",
visitorId
);


}
catch(error){

console.error(
"Register visitor error:",
error
);

}

}


/* ================= تحديث الزائر ================= */

async function updateVisitor(values){

try{

if(
!supabaseClient ||
!visitorId
){

return;

}


const {
error
} =
await supabaseClient
.from("game_visitors")
.update(values)
.eq("id",visitorId);


if(error){

console.error(
"Visitor update error:",
error
);

}

}
catch(error){

console.error(
"Update visitor error:",
error
);

}

}


/* ================= بدء اللعبة ================= */

async function startGame(){

const input =
document.getElementById("name");

const error =
document.getElementById("nameError");

const value =
input.value.trim();


error.textContent = "";


/* الاسم مطلوب */

if(!value){

error.textContent =
"⚠️ من فضلك اكتب اسمك أولًا.";

input.focus();

return;

}


/* التأكد من الاسم */

if(value.length < 2){

error.textContent =
"⚠️ اكتب اسمًا صحيحًا.";

input.focus();

return;

}


playerName =
value;


document.getElementById(
"playerName"
).textContent =
playerName;


document.getElementById(
"intro"
).classList.add(
"hidden"
);


document.getElementById(
"game"
).classList.remove(
"hidden"
);


await updateVisitor({

name:playerName

});

}


/* ================= الجوائز ================= */

const prizes = {

1:"خصم 20% على سعر الاشتراك",

2:"أسبوع مجاني على باقة الشهر",

3:"سهم مجاني من باقة الـ Standard",

4:"سهم مجاني من باقة الـ VIP",

5:"سهم للمتابعة"

};


/* ================= إنشاء رسالة واتساب ================= */

function createWhatsappMessage(){

return `🎁 السلام عليكم Al Fayed Stocks

أنا ${playerName} اخترت الصندوق رقم ${selectedBox} 🎉

🎁 هديتي:
${selectedPrize}

وحابب أستفيد بيها 😊

ممكن توضحولي الخطوات؟

شكراً ❤️`;

}


/* ================= فتح واتساب ================= */

async function openWhatsapp(){

if(
!playerName ||
!selectedPrize ||
selectedBox === null
){

return;

}


const phone =
"966575944806";


const message =
createWhatsappMessage();


const url =
"https://wa.me/" +
phone +
"?text=" +
encodeURIComponent(message);


/* تحديث البيانات */

await updateVisitor({

whatsapp_shared:true,

box_number:selectedBox,

result:selectedPrize

});


/* فتح واتساب */

window.open(
url,
"_blank",
"noopener"
);

}


/* ================= اختيار الصندوق ================= */

async function chooseBox(button){

/* منع اختيار أكثر من صندوق */

if(selectedBox !== null){

return;

}


selectedBox =
Number(button.dataset.box);


/* تحديد الهدية */

selectedPrize =
prizes[selectedBox];


/* تعطيل الصناديق */

const buttons =
document.querySelectorAll(".box");


buttons.forEach(function(item){

item.disabled = true;

});


/* تغيير شكل الصندوق */

button.innerHTML =
"🎉<span class='num'>تم الاختيار</span>";


/* عرض الهدية */

document.getElementById(
"resultText"
).innerHTML =

"🎉 مبروك يا " +
playerName +
"!<br><br>" +

"🎁 هديتك:<br>" +

"<span style='color:#20c878'>" +
selectedPrize +
"</span>";


document.getElementById(
"result"
).style.display =
"block";


/* حفظ النتيجة في Supabase */

updateVisitor({

box_number:selectedBox,

result:selectedPrize

});


/* النزول للنتيجة */

window.scrollTo({

top:
document.getElementById(
"result"
).offsetTop - 30,

behavior:"smooth"

});


/* التحويل التلقائي إلى واتساب */

setTimeout(function(){

openWhatsapp();

},1500);

}


/* ================= تجربة جديدة ================= */

function playAgain(){

selectedBox = null;

selectedPrize = "";


document.getElementById(
"result"
).style.display =
"none";


document.querySelectorAll(
".box"
).forEach(
function(button){

button.disabled = false;

button.innerHTML =
"🎁<span class='num'>الصندوق " +
button.dataset.box +
"</span>";

});

}


/* ================= الأحداث ================= */

document.getElementById(
"start"
).addEventListener(
"click",
startGame
);


document.getElementById(
"name"
).addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

startGame();

}

});


document.querySelectorAll(
".box"
).forEach(
function(button){

button.addEventListener(
"click",
function(){

chooseBox(button);

});

});


document.getElementById(
"shareWhatsapp"
).addEventListener(
"click",
openWhatsapp
);


document.getElementById(
"again"
).addEventListener(
"click",
playAgain
);


/* ================= تشغيل Supabase ================= */

document.addEventListener(
"DOMContentLoaded",
async function(){

await registerVisitor();

});


</script>

</body>

</html>
